:root{
  --bg:#f6f8f3; --card:#fff; --tx:#1d2b22; --mut:#5d6b62;
  --ac:#2e7d4f; --ac-dark:#23603d; --ac2:#e4f1e8; --bd:#dfe7dc;
  --shadow:0 8px 22px rgba(29,43,34,.08);

html[data-theme="dark"]{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{

  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.65;
  transition:background .25s,color .25s;
}
img{max-width:100%;display:block}

}
h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.5rem)}
header p{margin:0 auto;color:var(--mut);max-width:680px}

.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);
}
