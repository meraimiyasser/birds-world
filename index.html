<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds World – A Complete Bird Guide</title>
<meta name="description" content="A complete bird guide: species, diet, care tips, health and nutrition, with an AI assistant for bird questions.">
<style>
:root{--bg:#f6f8f4;--card:#fff;--text:#1f2a1f;--muted:#5d6b5d;--accent:#2f7d4f;--line:#e3e8e0;--warn:#fff4e0;--warnt:#7a4b00}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent)}
.top{padding:28px 16px 12px;text-align:center}
.top a.logo{font-size:1.9rem;font-weight:700;text-decoration:none;color:var(--text)}
.top p{margin:4px 0 0;color:var(--muted)}
.search{max-width:520px;margin:16px auto 0;display:block;width:calc(100% - 32px);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:1rem}
.grid{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.photo{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.photo img.loaded{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem}
.cb{padding:14px 16px 16px}
.cb h2{margin:0;font-size:1.15rem}
.sci{margin:2px 0 8px;color:var(--muted);font-style:italic;font-size:.9rem}
.more{color:var(--accent);font-weight:600;font-size:.9rem}
/* detail page */
.wrap{max-width:820px;margin:0 auto;padding:16px}
.back{display:inline-block;margin-bottom:12px;text-decoration:none;font-weight:600}
.hero{border-radius:18px;overflow:hidden;background:var(--line);aspect-ratio:16/10;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.hero img.loaded{opacity:1}
h1{margin:18px 0 0;font-size:2rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--muted)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0}
.sec h3{margin:0 0 6px;color:var(--accent)}
.sec ul{margin:6px 0 0;padding-left:20px}
.warn{background:var(--warn);color:var(--warnt);border-radius:12px;padding:12px 16px;font-size:.9rem;margin:14px 0}
.credit{font-size:.78rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.nav a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 16px 40px}
</style>
</head>
<body>

<div class="top">
  <a class="logo" href="#/">🐦 Birds World</a>
  <p>Species, diet, care tips, health and nutrition</p>
</div>
<div id="app"></div>
<footer>Photos and summaries from Wikipedia / Wikimedia Commons under their respective licenses.</footer>
