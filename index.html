<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds World – A Complete Bird Guide</title>
<meta name="description" content="A complete bird guide: species, diet, care tips, common diseases and treatment, with an AI assistant for bird questions.">
<style>
:root{--bg:#f6f8f4;--card:#fff;--text:#1f2a1f;--muted:#5d6b5d;--ac:#2f7d4f;--line:#e3e8e0;--warn:#fff4e0;--wt:#7a4b00;--red:#fdeaea;--rt:#8a1c1c}
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--ac)}button{font:inherit;cursor:pointer}
.top{padding:26px 16px 8px;text-align:center}
.logo{font-size:1.9rem;font-weight:700;text-decoration:none;color:var(--text)}
.top p{margin:4px 0 0;color:var(--muted)}
.bar{max-width:1100px;margin:0 auto;padding:0 16px}
.search{display:block;width:100%;max-width:520px;margin:14px auto;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.row button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px}
.grid{max-width:1100px;margin:14px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>a{text-decoration:none;color:inherit;display:block}
.photo{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden}
.photo img,.hero img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.photo img.ld,.hero img.ld{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem}
.cb{padding:12px 14px 14px}.cb h2{margin:0;font-size:1.08rem}
.sci{margin:2px 0 6px;color:var(--muted);font-style:italic;font-size:.88rem}
.tag{display:inline-block;background:var(--bg);border-radius:10px;padding:2px 8px;font-size:.78rem;color:var(--muted)}
.fv{position:absolute;top:8px;right:8px;z-index:2;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:34px;height:34px;font-size:1.1rem;color:#d33}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:600}
.hero{border-radius:18px;overflow:hidden;background:var(--line);aspect-ratio:16/10;position:relative}
.credit{font-size:.76rem;color:var(--muted);margin:4px 0}
h1{margin:12px 0 0;font-size:1.9rem}
.acts{display:flex;gap:8px;margin:8px 0}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.fact small{display:block;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 14px;font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pn{display:none}.pn.on{display:block}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:10px 0}
.sec ul{margin:4px 0;padding-left:20px}
.dz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.dz summary{font-weight:700;cursor:pointer;color:var(--ac)}
.warn{background:var(--warn);color:var(--wt);border-radius:12px;padding:12px 16px;font-size:.9rem;margin:12px 0}
.urg{background:var(--red);color:var(--rt);border-radius:12px;padding:12px 16px;font-size:.92rem;margin:10px 0}
.sim{display:flex;gap:8px;flex-wrap:wrap}.sim a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-decoration:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin:20px 0}
.nav a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px 40px}
</style>
</head>
<body>
<div class="top"><a class="logo" href="#/">🐦 Birds World</a><p>Species, diet, care, diseases and treatment</p></div>

/* ===== 4) PHOTO + SUMMARY + PHOTO CREDIT (Wikipedia / Commons, free, cached) ===== */
const CK="bw_wiki_v4";let cache={};
try{cache=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){}
const saveC=()=>{try{localStorage.setItem(CK,JSON.stringify(cache))}catch(e){}};
async function wiki(t){
 t=t[0]+t.slice(1).toLowerCase();
 if(cache[t])return cache[t];
 const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));
 if(!r.ok)throw 0;const d=await r.json();const th=d.thumbnail&&d.thumbnail.source;
 const o={img:th?th.replace(/\/\d+px-/,"/800px-"):(d.originalimage&&d.originalimage.source)||"",text:d.extract||"",page:d.content_urls?d.content_urls.desktop.page:"https://en.wikipedia.org/wiki/"+t};
 cache[t]=o;saveC();return o;
}
/* finds photographer + license of a Commons image from its URL */
async function credit(src){
 const m=src.match(/FilePath\/([^?]+)/)||src.match(/\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^\/?]+)/);
 if(!m)return null;
 const f=decodeURIComponent(m[1]),k="c:"+f;
 if(cache[k])return cache[k];
 const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&origin=*&titles="+encodeURIComponent("File:"+f));
 const d=await r.json(),p=Object.values(d.query.pages)[0],x=p.imageinfo&&p.imageinfo[0].extmetadata;
 if(!x)return null;
 const strip=h=>h?String(h).replace(/<[^>]*>/g,"").trim():"";
 const o={f,a:strip(x.Artist&&x.Artist.value),l:strip(x.LicenseShortName&&x.LicenseShortName.value)};
 cache[k]=o;saveC();return o;
}

const app=document.getElementById("app"),SITE="Birds World – A Complete Bird Guide";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const isF=id=>favs.includes(id);

/* ===== 6) HOME PAGE ===== */
function home(){

 const chips=[["all","All"],["fav","♥ Favorites"],...Object.keys(G).map(k=>[k,G[k].e+" "+G[k].n])];

 const grid=document.getElementById("grid");
 function draw(){
  const q=st.q.toLowerCase();

  document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip ${st.g===c[0]?"on":""}" data-g="${c[0]}">${esc(c[1])}</button>`).join("");
  document.getElementById("cnt").textContent=items.length+" bird"+(items.length===1?"":"s");
  grid.innerHTML=items.map(b=>`<div class="card"><button class="fv" data-id="${b.id}">${isF(b.id)?"♥":"♡"}</button><a href="#/bird/${b.id}" data-w="${esc(b.wiki)}" data-i="${esc(b.img)}"><div class="photo"><div class="ph">${G[b.g].e}</div><img alt="${esc(b.name)}" loading="lazy"></div><div class="cb"><h2>${esc(b.name)}</h2><p class="sci">${esc(b.sci)}</p><span class="tag">${G[b.g].e} ${esc(G[b.g].n)}</span></div></a></div>`).join("")||"<p>No birds found.</p>";
  const io=new IntersectionObserver(es=>es.forEach(async e=>{
   if(!e.isIntersecting)return;io.unobserve(e.target);const box=e.target.querySelector(".photo");
   if(e.target.dataset.i)return showImg(box,e.target.dataset.i);
   try{showImg(box,(await wiki(e.target.dataset.w)).img)}catch(x){}
  }),{rootMargin:"200px"});
  grid.querySelectorAll(".card>a").forEach(a=>io.observe(a));
 }
 document.getElementById("q").oninput=e=>{st.q=e.target.value.trim();draw()};
 document.getElementById("chips").onclick=e=>{const g=e.target.dataset.g;if(g){st.g=g;draw()}};
 grid.onclick=e=>{const id=e.target.dataset.id;if(id){toggleF(id);e.target.textContent=isF(id)?"♥":"♡";if(st.g==="fav")draw()}};
 document.getElementById("rnd").onclick=()=>{location.hash="#/bird/"+S[Math.floor(Math.random()*S.length)].id};
 draw();
}

/* ===== 7) BIRD PAGE ===== */
function detail(id){
 const i=S.findIndex(b=>b.id===id);
 if(i<0){app.innerHTML='<div class="wrap"><a class="back" href="#/">← All birds</a><p>Bird not found.</p></div>';return}
 const b=S[i],g=G[b.g],p=S[(i+S.length-1)%S.length],n=S[(i+1)%S.length],sim=S.filter(x=>x.g===b.g&&x.id!==b.id).slice(0,5);
 document.title=b.name+" – Care, Diseases & Treatment | Birds World";
 const dz=g.dis.map(d=>`<details class="dz"><summary>${esc(d[0])}</summary><p><b>Signs:</b> ${esc(d[1])}</p><p><b>Possible treatment:</b> ${esc(d[2])}</p></details>`).join("");
 app.innerHTML=`<article class="wrap"><a class="back" href="#/">← All birds</a>
 <div class="hero" id="hero"><div class="ph">${g.e}</div><img alt="${esc(b.name)}"></div><p class="credit" id="credit"></p>
 <h1>${esc(b.name)}</h1><p class="sci">${esc(b.sci)} · ${g.e} ${esc(g.n)}</p>
 <div class="acts"><button id="fb">${isF(b.id)?"♥ Saved":"♡ Save"}</button><button id="sh">🔗 Share</button></div>
 <div class="tabs" id="tabs"><button class="tab on" data-t="ov">Overview</button><button class="tab" data-t="di">Diet</button><button class="tab" data-t="ca">Care</button><button class="tab" data-t="dz">Diseases & Treatment</button></div>
 <section class="pn on" id="p-ov"><p id="about">Loading description…</p>
  <div class="facts"><div class="fact"><small>Origin</small>${esc(b.o)}</div><div class="fact"><small>Size</small>${esc(b.s)}</div><div class="fact"><small>Lifespan</small>${esc(b.l)}</div></div>
  <div class="sec"><b>Diet tip:</b> ${esc(b.tip)}</div></section>
 <section class="pn" id="p-di"><div class="sec"><h3>🌾 Feeding guide</h3>${ul(g.diet)}<p><b>For this bird:</b> ${esc(b.tip)}</p></div>
  <div class="warn">Avoid avocado, chocolate, caffeine, alcohol, onion, garlic, salty or spoiled food, and anything moldy – these can be toxic to birds.</div></section>
 <section class="pn" id="p-ca"><div class="sec"><h3>🏠 Care & housing</h3>${ul(g.care)}</div></section>
 <section class="pn" id="p-dz"><div class="urg"><b>See a vet urgently if:</b> the bird is fluffed up and sleepy, sits on the cage floor, breathes with an open beak or tail bobbing, stops eating or drinking, has blood, cannot perch, or has sudden changes in droppings. Birds hide illness until they are very sick.</div>
  <h3>Common diseases (tap to open)</h3>${dz}
  <div class="warn">Treatment shown is general information about what vets usually do. Do not give medicines, antibiotics or doses by yourself – wrong treatment can kill a bird. Consult an avian vet.</div></section>
 <h3>Similar birds</h3><div class="sim">${sim.map(x=>`<a href="#/bird/${x.id}">${esc(x.name)}</a>`).join("")}</div>
 <div class="nav"><a href="#/bird/${p.id}">← ${esc(p.name)}</a><a href="#/bird/${n.id}">${esc(n.name)} →</a></div></article>`;
 document.getElementById("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll(".pn").forEach(x=>x.classList.toggle("on",x.id==="p-"+t))};
 document.getElementById("fb").onclick=e=>{toggleF(b.id);e.target.textContent=isF(b.id)?"♥ Saved":"♡ Save"};
 document.getElementById("sh").onclick=async()=>{try{if(navigator.share)await navigator.share({title:b.name,url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Link copied")}}catch(e){}};
 if(b.img)showImg(document.getElementById("hero"),b.img);
 wiki(b.wiki).then(async r=>{
  if(!b.img)showImg(document.getElementById("hero"),r.img);
  document.getElementById("about").textContent=r.text||"";
  const cr=document.getElementById("credit");
  const sum=`Summary: <a href="${r.page}" target="_blank" rel="noopener">Wikipedia</a>`;
  cr.innerHTML=sum;
  try{
   const c=await credit(b.img||r.img);
   if(c)cr.innerHTML=`Photo: ${esc(c.a||"Wikimedia Commons")}${c.l?" · "+esc(c.l):""} · <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(c.f)}" target="_blank" rel="noopener">source</a> · ${sum}`;
  }catch(e){}
 }).catch(()=>{document.getElementById("about").textContent=""});
}

/* ===== 8) ROUTER ===== */
function route(){const m=location.hash.match(/^#\/bird\/([\w-]+)/);m?detail(m[1]):home();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script>
</body>
