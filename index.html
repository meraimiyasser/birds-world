*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none}

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:1.4rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.nav-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:.9rem;transition:background .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ac-hover)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--text)}

.hero-banner{text-align:center;padding:30px 20px 10px;max-width:900px;margin:0 auto}
.hero-banner h1{margin:0 0 8px;font-size:2.2rem}

.main-container{max-width:1200px;margin:0 auto;padding:0 20px 40px}
.control-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input,.select-input{flex:1;min-width:180px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:1rem}
.select-input{flex:0 0 220px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 14px;font-size:.85rem;font-weight:500;transition:all .2s}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat-card h4{margin:0 0 4px;color:var(--muted);font-size:.8rem;text-transform:uppercase}

.bird-day .emoji{font-size:3rem}
.bird-day h3{margin:0}
.bird-day p{margin:4px 0 0;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.card a{display:block;color:inherit;text-decoration:none}
.photo{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.photo img.ld{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.card-body{padding:16px}

.sci{margin:0 0 8px;color:var(--muted);font-style:italic;font-size:.85rem}

.back-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-bottom:16px}
.hero-detail{border-radius:20px;overflow:hidden;background:var(--line);aspect-ratio:16/9;position:relative;box-shadow:var(--shadow);cursor:zoom-in}

.detail-meta{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.meta-badge{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0 12px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:600;color:var(--text);white-space:nowrap;transition:background .2s}
.tab.on{background:var(--ac);color:#fff}
.panel{display:none}
.panel.on{display:block}
.box-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}

.calc-results,.breed-results{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:12px;font-size:.95rem}

.quiz-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow);text-align:center}
.quiz-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}

.search-row{flex-direction:column}
.select-input{width:100%}
.bird-day{flex-direction:column;text-align:center}

@media print{
header,.nav-actions,.tabs,footer,.control-panel,.fv-btn,.quiz-box{display:none!important}

const saveC=()=>{try{localStorage.setItem(CK,JSON.stringify(cache))}catch(e){}};

async function wiki(t){
 t=t[0]+t.slice(1).toLowerCase();
 if(cache[t])return cache[t];
 const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));
 if(!r.ok)throw 0;
 const d=await r.json();
 const th=d.thumbnail&&d.thumbnail.source;
 const o={
  img:th?th.replace(/\/\d+px-/,"/800px-"):(d.originalimage&&d.originalimage.source)||"",
  text:d.extract||"",
  page:d.content_urls?d.content_urls.desktop.page:"https://en.wikipedia.org/wiki/"+t
 };
 cache[t]=o;saveC();return o;
}

async function credit(src){
 if(!src)return null;
 const m=src.match(/FilePath\/([^?]+)/);
 if(!m)return null;
 const f=decodeURIComponent(m[1]),k="c:"+f;
 if(cache[k])return cache[k];
 const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&origin=*&titles="+encodeURIComponent("File:"+f));
 const d=await r.json();
 const p=Object.values(d.query.pages)[0];
 const x=p.imageinfo&&p.imageinfo[0].extmetadata;
 if(!x)return null;
 const strip=h=>h?String(h).replace(/<[^>]*>/g,"").trim():"";
 const o={f:f,a:strip(x.Artist&&x.Artist.value),l:strip(x.LicenseShortName&&x.LicenseShortName.value)};
 cache[k]=o;saveC();return o;
}

/* ================= SOUND ================= */
function playBirdSynth(freq){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  const ctx=new AudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(freq,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq*1.5,ctx.currentTime+.1);
  osc.frequency.exponentialRampToValueAtTime(freq*.8,ctx.currentTime+.2);
  gain.gain.setValueAtTime(.3,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.3);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+.3);
 }catch(e){}
}

async function loadRealBirdSound(b){
 const box=document.getElementById("realAudioBox");
 if(!box)return;
 box.innerHTML="<p>🔎 Searching real recordings…</p>";
 try{
  const q=encodeURIComponent('sp:"'+b.sci+'"');
  const r=await fetch("https://xeno-canto.org/api/2/recordings?query="+q);
  const d=await r.json();
  const rec=d.recordings&&d.recordings[0];
  if(!rec){
   box.innerHTML="<p>No real recording found for this species.</p>";
   return;
  }
  box.innerHTML=`
   <audio controls preload="none" style="width:100%">
    <source src="${rec.file}" type="audio/mpeg">
   </audio>
   <p style="font-size:.85rem;color:var(--muted)">
    Recording by ${rec.rec||"Unknown"} · ${rec.cnt||""} ·
    <a href="${rec.url}" target="_blank" rel="noopener noreferrer">Xeno-canto</a>
   </p>`;
 }catch(e){
  box.innerHTML="<p>Could not load the recording. Please check your connection.</p>";
 }
}
