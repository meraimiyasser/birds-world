<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds World – Complete 45 Birds Guide PRO++</title>
<meta name="description" content="Complete professional bird guide with all 45 bird species, photo credits, diet calculator, breeding tracker, notes, and voice search.">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--ac:#10b981;--ac-hover:#059669;--line:#e2e8f0;--warn:#fef3c7;--wt:#92400e;--red:#fee2e2;--rt:#991b1b;--shadow:0 4px 6px -1px rgba(0,0,0,0.05),0 2px 4px -1px rgba(0,0,0,0.03)}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--ac:#34d399;--ac-hover:#10b981;--line:#334155;--warn:#451a03;--wt:#fde68a;--red:#7f1d1d;--rt:#fca5a5;--shadow:0 4px 6px -1px rgba(0,0,0,0.2)}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none}

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.5rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.nav-actions{display:flex;gap:10px;align-items:center}
.btn{background:var(--ac);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:.9rem;transition:background .2s}
.btn:hover{background:var(--ac-hover)}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}

.hero-banner{text-align:center;padding:30px 20px 10px;max-width:800px;margin:0 auto}
.hero-banner h1{margin:0 0 8px;font-size:2.2rem}
.hero-banner p{color:var(--muted);margin:0}

.main-container{max-width:1200px;margin:0 auto;padding:0 20px 40px}
.control-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.search-row{display:flex;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 14px;font-size:.85rem;font-weight:500;transition:all .2s}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat-card h4{margin:0 0 4px;color:var(--muted);font-size:.85rem;text-transform:uppercase}
.stat-card .val{font-size:1.5rem;font-weight:800}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative}
.card:hover{transform:-translateY(4px);box-shadow:0 10px 15px -3px rgba(0,0,0,0.1)}
.card a{display:block;color:inherit;text-decoration:none}
.photo{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.photo img.ld{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.card-body{padding:16px}
.card-body h3{margin:0 0 4px;font-size:1.1rem}
.sci{margin:0 0 8px;color:var(--muted);font-style:italic;font-size:.85rem}
.tag{display:inline-block;background:var(--bg);border-radius:8px;padding:2px 8px;font-size:.75rem;color:var(--muted);border:1px solid var(--line)}
.fv-btn{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#ef4444;box-shadow:var(--shadow)}

/* Detail View */
.wrap{max-width:900px;margin:0 auto;padding:20px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-bottom:16px}
.hero-detail{border-radius:20px;overflow:hidden;background:var(--line);aspect-ratio:16/9;position:relative;box-shadow:var(--shadow)}
.credit{font-size:.78rem;color:var(--muted);margin:6px 0 14px}
.detail-meta{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.meta-badge{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0 12px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:600;color:var(--text);white-space:nowrap;transition:background .2s}
.tab.on{background:var(--ac);color:#fff}
.panel{display:none}.panel.on{display:block}
.box-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}
.notes-area{width:100%;height:100px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;margin-top:8px}

.calc-group, .breed-group{margin:12px 0}
.calc-group label, .breed-group label{display:block;font-weight:600;margin-bottom:6px}
.calc-input, .breed-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.calc-results, .breed-results{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:12px;font-size:.95rem}
.audio-player-box{display:flex;align-items:center;gap:14px;background:var(--bg);padding:14px;border-radius:12px;border:1px solid var(--line);margin-top:10px}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding:40px 20px;border-top:1px solid var(--line);margin-top:40px}
@media print { header, .nav-actions, .tabs, footer, .control-panel, .fv-btn { display: none !important; } body { background: #fff; color: #000; } }
</style>
</head>

 <div class="hero-banner">
  <h1>Discover the Wonderful World of Birds</h1>
  <p>Complete professional avian guide featuring all 45 species, photo credits, calculators, audio, breeding tracking and notes.</p>
 </div>
 <main class="main-container">
  <div class="stats-grid">
   <div class="stat-card"><h4>Total Species</h4><div class="val">${S.length}</div></div>
   <div class="stat-card"><h4>Families</h4><div class="val">${Object.keys(G).length}</div></div>
   <div class="stat-card"><h4>Saved Favorites</h4><div class="val">${favs.length}</div></div>
  </div>

  <div class="control-panel">
   <div class="search-row">
    <input id="q" class="search-input" type="search" placeholder="Search all ${S.length} birds by name, origin or scientific name..." value="${st.q}">
    <button class="btn" id="voiceBtn">🎙️ Voice</button>
   </div>
   <div class="chips" id="chips"></div>
  </div>

  <div class="grid" id="grid"></div>
 </main>`;

 const grid=document.getElementById("grid");
 function draw(){
  const q=st.q.toLowerCase().trim();
  const items=S.filter(b=>(st.g==="all"||(st.g==="fav"?isF(b.id):b.g===st.g))&&(b.name+" "+b.sci+" "+b.o).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  
  document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip ${st.g===c[0]?"on":""}" data-g="${c[0]}">${c[1]}</button>`).join("");
  
  grid.innerHTML=items.map(b=>`
   <div class="card">
    <button class="fv-btn" data-id="${b.id}">${isF(b.id)?"♥":"♡"}</button>
    <a href="#/bird/${b.id}">
     <div class="photo"><div class="ph">${G[b.g].e}</div><img alt="${b.name}" loading="lazy"></div>
     <div class="card-body">
      <h3>${b.name}</h3>
      <p class="sci">${b.sci}</p>
      <span class="tag">${G[b.g].e} ${G[b.g].n}</span>
     </div>
    </a>
   </div>`).join("")||"<p style='grid-column:1/-1;text-align:center;color:var(--muted);padding:40px'>No birds found matching your search.</p>";

  grid.querySelectorAll(".card>a").forEach(async a=>{
   const href=a.getAttribute("href");
   const id=href.split("/")[2];
   const bird=S.find(x=>x.id===id);
   const box=a.querySelector(".photo");
   if(bird.img) showImg(box,bird.img);
   else {
    try{const r=await wiki(bird.wiki);if(r.img)showImg(box,r.img);}catch(e){}
   }
  });
 }

 document.getElementById("q").oninput=e=>{st.q=e.target.value;draw()};
 document.getElementById("chips").onclick=e=>{const g=e.target.dataset.g;if(g){st.g=g;draw()}};
 grid.onclick=e=>{
  const fvBtn=e.target.closest(".fv-btn");
  if(fvBtn){
   const id=fvBtn.dataset.id;
   toggleF(id);
   fvBtn.textContent=isF(id)?"♥":"♡";
   if(st.g==="fav") draw();
  }
 };

 document.getElementById("voiceBtn").onclick=()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){alert("Voice search not supported.");return;}
  const rec=new SpeechRecognition();
  rec.onresult=e=>{document.getElementById("q").value=e.results[0][0].transcript;st.q=e.results[0][0].transcript;draw();};
  rec.start();
 };

 draw();
}

/* ===== DETAIL PAGE ===== */
function detail(id){
 const b=S.find(x=>x.id===id);
 if(!b){app.innerHTML="<div class='wrap'><h2>Bird not found</h2><a href='#/'>Back to home</a></div>";return;}
 const g=G[b.g];
 const userNote=notes[id]||"";
 const baseWeight=g.foodWeight||15;
 const incDays=g.incDays||18;
 const todayStr=new Date().toISOString().split('T')[0];

 app.innerHTML=`
 <main class="wrap">
  <a class="back-link" href="#/">← Back to all birds</a>
  <div class="hero-detail" id="hero"><div class="ph">${g.e}</div><img alt="${b.name}"></div>
  <p class="credit" id="credit">Loading photo credits & summary…</p>
  
  <h1>${b.name}</h1>
  <p class="sci">${b.sci} · ${g.e} ${g.n}</p>

  <div class="detail-meta">
   <div class="meta-badge">🌍 Origin: <b>${b.o}</b></div>
   <div class="meta-badge">📏 Size: <b>${b.s}</b></div>
   <div class="meta-badge">⏳ Lifespan: <b>${b.l}</b></div>
  </div>

  <div class="tabs" id="tabs">
   <button class="tab on" data-t="ov">Overview</button>
   <button class="tab" data-t="di">Feeding Calc</button>
   <button class="tab" data-t="au">Audio & Sounds</button>
   <button class="tab" data-t="br">Breeding Tracker</button>
   <button class="tab" data-t="ca">Care</button>
   <button class="tab" data-t="dz">Diseases</button>
   <button class="tab" data-t="nt">My Notes</button>
  </div>

  <div class="panel on" id="p-ov">
   <div class="box-section"><p id="about">Loading encyclopedia details…</p></div>
   <div class="box-section"><b>Special Diet Tip:</b> ${b.tip}</div>
  </div>

  <div class="panel" id="p-di">
   <div class="box-section">
    <h3>🌾 Feeding & Diet Guidelines</h3>
    <ul>${g.diet.map(x=>`<li>${x}</li>`).join("")}</ul>
   </div>
   <div class="box-section">
    <h3>⚖️ Daily Feed & Water Calculator</h3>
    <div class="calc-group">
     <label for="birdCount">Number of Birds:</label>
     <input type="number" id="birdCount" class="calc-input" value="1" min="1" max="1000">
    </div>
    <div class="calc-results" id="calcResults">
     <div>• Dry Seeds / Pellets: <b><span id="resFood">${baseWeight}</span> g / day</b></div>
     <div>• Fresh Vegetables / Greens: <b><span id="resVeg">${Math.round(baseWeight*0.4)}</span> g / day</b></div>
     <div>• Clean Drinking Water: <b><span id="resWater">${baseWeight*2}</span> ml / day</b></div>
    </div>
   </div>
  </div>

  <div class="panel" id="p-au">
   <div class="box-section">
    <h3>🎵 Bird Calls & Singing Player</h3>
    <p style="color:var(--muted);font-size:.9rem">Listen to natural singing and calls associated with this bird family (${g.n}):</p>
    <div class="audio-player-box">
     <div style="font-size:2rem">🔊</div>
     <div style="flex:1">
      <div style="font-weight:600">${g.n} Natural Song & Calls</div>
      <div style="font-size:0.85rem;color:var(--muted)">Search audio recordings and natural calls</div>
     </div>
     <a class="btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(g.audioQuery)}" target="_blank" rel="noopener">▶ Search Audio on YouTube</a>
    </div>
   </div>
  </div>

  <div class="panel" id="p-br">
   <div class="box-section">
    <h3>🗓️ Breeding & Hatching Tracker</h3>
    <p style="color:var(--muted);font-size:.9rem">Calculate expected hatching date based on incubation period (~${incDays} days for ${g.n}).</p>
    <div class="breed-group">
     <label for="incStartDate">Incubation Start Date (Eggs set):</label>
     <input type="date" id="incStartDate" class="breed-input" value="${todayStr}">
    </div>
    <div class="breed-results" id="breedResults">
     <div>• Expected Hatching Date: <b id="resHatch">...</b></div>
     <div>• Estimated Incubation Period: <b>${incDays} Days</b></div>
    </div>
   </div>
  </div>

  <div class="panel" id="p-ca">
   <div class="box-section"><h3>🏠 Care & Housing</h3><ul>${g.care.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  </div>

  <div class="panel" id="p-dz">
   <div class="box-section"><h3>🩺 Common Health Issues</h3>
    ${g.dis.map(d=>`<p><b>• ${d[0]}:</b>${d[1]}<br><small style="color:var(--muted)">Treatment: ${d[2]}</small></p>`).join("<hr style='border:0;border-top:1px solid var(--line);margin:10px 0'>")}
   </div>
  </div>

  <div class="panel" id="p-nt">
   <div class="box-section">
    <h3>📝 Personal Notes (Saved Locally)</h3>
    <textarea class="notes-area" id="noteInput" placeholder="Type your breeding or medical notes here...">${userNote}</textarea>
    <button class="btn" style="margin-top:10px" id="saveNoteBtn">Save Note</button>
   </div>
  </div>
 </main>`;

 document.getElementById("tabs").onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on",x.id==="p-"+t));
 };

 /* Calculator Logic */
 const countInput=document.getElementById("birdCount");
 if(countInput){
  countInput.oninput=e=>{
   const val=Math.max(1, parseInt(e.target.value)||1);
   document.getElementById("resFood").textContent=val*baseWeight;
   document.getElementById("resVeg").textContent=Math.round(val*baseWeight*0.4);
   document.getElementById("resWater").textContent=val*baseWeight*2;
  };
 }

 /* Breeding Calculator Logic */
 const dateInput=document.getElementById("incStartDate");
 function updateHatchDate(){
  if(!dateInput.value)return;
  const d=new Date(dateInput.value);
  d.setDate(d.getDate()+incDays);
  document.getElementById("resHatch").textContent=d.toDateString();
 }
 if(dateInput){
  dateInput.onchange=updateHatchDate;
  updateHatchDate();
 }

 document.getElementById("saveNoteBtn").onclick=()=>{
  const val=document.getElementById("noteInput").value;
  notes[id]=val;
  try{localStorage.setItem("bw_notes_pro",JSON.stringify(notes));alert("Note saved successfully!");}catch(e){}
 };

 const hero=document.getElementById("hero");
 if(b.img)showImg(hero,b.img);
 wiki(b.wiki).then(async r=>{
  if(!b.img&&r.img)showImg(hero,r.img);
  document.getElementById("about").textContent=r.text||"No description available.";
  const cr=document.getElementById("credit");
  const sum=`Summary: <a href="${r.page}" target="_blank" rel="noopener">Wikipedia</a>`;
  cr.innerHTML=sum;
  try{
   const c=await credit(b.img||r.img);
   if(c){
    let txt=`Photo: `;
    if(c.a)txt+=c.a+" ";
    if(c.l)txt+=`(${c.l}) `;
    cr.innerHTML=`${txt} / <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(c.f)}" target="_blank" rel="noopener">Wikimedia Commons</a> · ${sum}`;
   }
  }catch(e){}
 }).catch(()=>{document.getElementById("about").textContent="Failed to load summary."});
}

/* Router */
function route(){
 const h=location.hash;
 if(h.startsWith("#/bird/"))detail(h.slice(7));
 else home();
 window.scrollTo(0,0);
}
window.onhashchange=route;
window.onload=route;
</script>
</body>
</html>
